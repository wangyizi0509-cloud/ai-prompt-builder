name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_impl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check . --output-format=github

  test:
    name: Unit Tests (Mock LLM)
    runs-on: ubuntu-latest
    needs: lint
    env:
      LLM_PROVIDER: mock
      PYTHONPATH: ${{ github.workspace }}/agent_impl
    defaults:
      run:
        working-directory: agent_impl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent_impl/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (skip api_test and e2e)
        run: pytest tests/ -m "not api_test" --tb=short -q --timeout=60
