name: Funnel Daily Report

# 每天北京时间 10:00 跑一次（= UTC 02:00）
# 也允许手动触发测试
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期（YYYY-MM-DD，北京时间），留空=昨天'
        required: false
        default: ''

jobs:
  push-funnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install supabase==2.8.1 requests

      - name: Run funnel report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/funnel_daily_report.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/funnel_daily_report.py
          fi
