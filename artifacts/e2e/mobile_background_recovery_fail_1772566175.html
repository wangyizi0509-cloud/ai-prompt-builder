<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登录/注册 - Crushe AI</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        :root {
            --text-main: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --bg: #ffffff;
            --sheet-bg: #ffffff;
            --overlay: rgba(17, 24, 39, 0.55);
            --primary: #0b0b0b;
            --primary-text: #ffffff;
            --secondary: #ffffff;
            --secondary-text: #0b0b0b;
            --secondary-border: #e6e6e6;
            --input-bg: #f7f7f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            color: var(--text-main);
        }

        #app {
            width: 100%;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* iOS safe-area support (notch) */
            padding: calc(22px + env(safe-area-inset-top))
                     calc(20px + env(safe-area-inset-right))
                     calc(16px + env(safe-area-inset-bottom))
                     calc(20px + env(safe-area-inset-left));
            max-width: 520px;
            margin: 0 auto;
        }

        .hero {
            text-align: center;
            width: 100%;
            padding-top: 6px;
        }

        .hero-figure {
            width: min(232px, 62vw);
            aspect-ratio: 1 / 1;
            margin: 26px auto 16px;
            position: relative;
            display: grid;
            place-items: center;
        }

        .hero-figure .circle {
            position: absolute;
            inset: 0;
            object-fit: contain;
            width: 100%;
            height: 100%;
        }

        .hero-figure .avatar {
            width: 86%;
            height: 86%;
            object-fit: contain;
            transform: translateY(1%);
        }

        .hero h1 {
            font-size: 36px;
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .hero p {
            font-size: 15px;
            line-height: 1.4;
            color: #9ca3af;
            font-weight: 500;
        }

        .bottom {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: auto;
            /* 让底部按钮整体再往上抬一点 */
            padding-bottom: calc(28px + env(safe-area-inset-bottom));
        }

        .btn {
            width: 70%;
            max-width: 360px;
            margin: 0 auto;
            border-radius: 16px;
            /* 按钮高度缩短 15%（主要由上下 padding 决定） */
            padding: 16px 16px;
            font-size: 16px;
            font-weight: 800;
            border: 1px solid transparent;
            cursor: pointer;
            transition: transform 0.08s ease, filter 0.2s ease;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.99);
        }

        .btn-primary {
            background: linear-gradient(180deg, #151515 0%, #0b0b0b 100%);
            color: var(--primary-text);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.18);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--secondary-text);
            border-color: var(--secondary-border);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.06);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Bottom sheet */
        .overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0 calc(12px + env(safe-area-inset-right)) calc(0px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
            z-index: 50;
        }

        .sheet {
            width: 100%;
            max-width: 520px;
            background: var(--sheet-bg);
            border-radius: 18px 18px 0 0;
            padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
            transform: translateY(0);
            animation: sheetUp 180ms ease-out;
        }

        @keyframes sheetUp {
            from { transform: translateY(22px); opacity: 0.9; }
            to { transform: translateY(0); opacity: 1; }
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .sheet-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.2px;
        }

        .sheet-close {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 22px;
            color: #111827;
            display: grid;
            place-items: center;
        }

        .message {
            padding: 12px 12px;
            border-radius: 12px;
            margin: 12px 0 14px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 6px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
        }

        .field input {
            width: 100%;
            border: none;
            outline: none;
            background: var(--input-bg);
            padding: 16px 16px;
            border-radius: 14px;
            font-size: 15px;
            color: #111827;
        }

        .field input::placeholder {
            color: #9ca3af;
        }

        .confirm {
            margin-top: 10px;
            background: var(--primary);
            color: var(--primary-text);
            border: none;
            border-radius: 14px;
            padding: 18px 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .confirm:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        @media (max-width: 420px) {
            .hero h1 { font-size: 34px; }
            .hero-figure { width: min(228px, 64vw); }
            .btn { width: 74%; }
        }
    </style>
</head>
<body>
    <div id="app" data-v-app=""><div class="page"><div class="hero"><div class="hero-figure" aria-hidden="true"><img class="circle" src="./assets/xiaohua_circle.png" alt=""><img class="avatar" src="./assets/xiaohua_wave.png" alt=""></div><h1>你好！ 我是小话.</h1><p>赶快登录咨询您的情感问题吧！</p></div><div class="bottom"><button class="btn btn-primary">登录</button><button class="btn btn-secondary">注册</button></div><!--v-if--></div></div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    sheetOpen: false,
                    sheetMode: 'login', // 'login' | 'register'
                    formData: {
                        email: '',
                        password: '',
                        username: ''
                    },
                    loading: false,
                    errorMessage: '',
                    successMessage: ''
                }
            },
            methods: {
                clearMessages() {
                    this.errorMessage = '';
                    this.successMessage = '';
                },
                resetForm() {
                    this.formData = { email: '', password: '', username: '' };
                },
                openSheet(mode) {
                    this.clearMessages();
                    this.loading = false;
                    this.sheetMode = mode;
                    this.resetForm();
                    this.sheetOpen = true;
                    // prevent body scroll when sheet open
                    document.body.style.overflow = 'hidden';
                },
                closeSheet() {
                    this.sheetOpen = false;
                    document.body.style.overflow = '';
                },
                async handleSubmit() {
                    this.clearMessages();
                    this.loading = true;

                    try {
                        const endpoint = this.sheetMode === 'login'
                            ? '/api/auth/login' 
                            : '/api/auth/register';

                        const payload = this.sheetMode === 'login'
                            ? {
                                email: this.formData.email,
                                password: this.formData.password
                            }
                            : this.formData;

                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.detail || '操作失败');
                        }

                        if (data.success) {
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('user', JSON.stringify(data.user));
                            localStorage.removeItem('session_id');
                            localStorage.removeItem('crusheGuideCompleted');

                            this.successMessage = this.sheetMode === 'login'
                                ? '登录成功，正在跳转...' 
                                : '注册成功，正在跳转...';

                            setTimeout(() => {
                                window.location.href = '/index.html';
                            }, 1000);
                        } else {
                            throw new Error('操作失败');
                        }
                    } catch (error) {
                        this.errorMessage = error.message || '操作失败，请稍后重试';
                        console.error('Auth error:', error);
                    } finally {
                        this.loading = false;
                    }
                }
            },
            mounted() {
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && this.sheetOpen) this.closeSheet();
                });
            }
        }).mount('#app');
    </script>


</body></html>
