<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8A4BFF">
<title>Crushe · 情感评估中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=DM+Sans:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles/onboarding.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar topbar--flat" style="border-bottom: 0.5px solid #EEE;">
    <span class="eyebrow eyebrow--violet">CRUSHE</span>
    <span style="font-size: 11px; color: #999;">情感评估中心</span>
  </div>

  <main class="splash-root">
    <div class="splash-logo-wrap">
      <div class="splash-mascot-glow" aria-hidden="true"></div>
      <img class="splash-mascot-img" src="assets/onboarding/mascot-new.png" alt=""
           onerror="this.onerror=null;this.src='assets/xiaohua_hero.png'">
    </div>

    <div class="splash-wordmark">CRUSHE</div>
    <div class="splash-tagline">让 语 言 更 加 触 动 人 心</div>

    <div class="splash-headline">
      <div class="splash-headline-main">
        看清 TA 对你的真实态度<br>知道下一步到底该怎么走
      </div>
      <div class="splash-headline-sub">
        基于 2,847 案例建模 · 3 分钟生成诊断
      </div>
    </div>

    <div class="splash-reviews">
      <div class="splash-review-chip">
        <div class="avatar">🧑🏻</div>
        <div class="meta">
          <div class="name">L 先生 · 28</div>
          <div class="text">诊断完才发现是我自己把节奏搞砸了……</div>
        </div>
      </div>
      <div class="splash-review-chip">
        <div class="avatar">👩🏻</div>
        <div class="meta">
          <div class="name">Y 女士 · 25</div>
          <div class="text">以为他没感觉，报告说我完全错解了。</div>
        </div>
      </div>
    </div>

    <div class="splash-cta-wrap">
      <button id="splash-cta" class="cta cta--solid" type="button">开始诊断</button>
      <div class="splash-fine-print">匿名 · 免费 · 3 分钟</div>
    </div>
  </main>
</div>

<script src="scripts/tracker.js"></script>
<script src="scripts/onboarding_flow.js"></script>
<script>
  window.CrusheOnboarding.initSplashPage();
  try { window.Tracker && window.Tracker.track('splash_view'); } catch (_) {}
  (function () {
    var btn = document.getElementById('splash-cta');
    if (!btn) return;
    btn.addEventListener('click', function () {
      try { window.Tracker && window.Tracker.track('splash_cta_click'); } catch (_) {}
    });
  })();
</script>
</body>
</html>
