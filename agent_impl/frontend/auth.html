<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册 - Crushe AI Agent</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: #f8f9fa;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }

        .form-container {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #c33;
        }

        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #3c3;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .loading::after {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.3s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <h1>Crushe AI Agent</h1>
                <p>欢迎使用智能情感咨询系统</p>
            </div>

            <div class="tabs">
                <div 
                    class="tab" 
                    :class="{ active: currentTab === 'login' }"
                    @click="currentTab = 'login'"
                >
                    登录
                </div>
                <div 
                    class="tab" 
                    :class="{ active: currentTab === 'register' }"
                    @click="currentTab = 'register'"
                >
                    注册
                </div>
            </div>

            <div class="form-container">
                <transition name="fade" mode="out-in">
                    <div :key="currentTab">
                        <div v-if="errorMessage" class="error">
                            {{ errorMessage }}
                        </div>

                        <div v-if="successMessage" class="success">
                            {{ successMessage }}
                        </div>

                        <form @submit.prevent="handleSubmit">
                            <div class="form-group" v-if="currentTab === 'register'">
                                <label for="username">用户名</label>
                                <input 
                                    type="text" 
                                    id="username"
                                    v-model="formData.username"
                                    placeholder="请输入用户名"
                                    :disabled="loading"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="email">邮箱</label>
                                <input 
                                    type="email" 
                                    id="email"
                                    v-model="formData.email"
                                    placeholder="请输入邮箱"
                                    :disabled="loading"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="password">密码</label>
                                <input 
                                    type="password" 
                                    id="password"
                                    v-model="formData.password"
                                    placeholder="请输入密码"
                                    :disabled="loading"
                                    required
                                >
                            </div>

                            <button 
                                type="submit" 
                                class="button"
                                :disabled="loading"
                            >
                                <span v-if="loading" class="loading"></span>
                                <span v-else>{{ currentTab === 'login' ? '登录' : '注册' }}</span>
                            </button>
                        </form>
                    </div>
                </transition>
            </div>

            <div class="footer">
                <p>Crushe AI Agent &copy; 2025</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    currentTab: 'login',
                    formData: {
                        email: '',
                        password: '',
                        username: ''
                    },
                    loading: false,
                    errorMessage: '',
                    successMessage: ''
                }
            },
            watch: {
                currentTab() {
                    this.clearMessages();
                    this.formData = {
                        email: '',
                        password: '',
                        username: ''
                    };
                }
            },
            methods: {
                clearMessages() {
                    this.errorMessage = '';
                    this.successMessage = '';
                },
                async handleSubmit() {
                    this.clearMessages();
                    this.loading = true;

                    try {
                        const endpoint = this.currentTab === 'login' 
                            ? '/api/auth/login' 
                            : '/api/auth/register';

                        const payload = this.currentTab === 'login'
                            ? {
                                email: this.formData.email,
                                password: this.formData.password
                            }
                            : this.formData;

                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.detail || '操作失败');
                        }

                        if (data.success) {
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('user', JSON.stringify(data.user));

                            this.successMessage = this.currentTab === 'login' 
                                ? '登录成功，正在跳转...' 
                                : '注册成功，正在跳转...';

                            setTimeout(() => {
                                window.location.href = '/index.html';
                            }, 1000);
                        } else {
                            throw new Error('操作失败');
                        }
                    } catch (error) {
                        this.errorMessage = error.message || '操作失败，请稍后重试';
                        console.error('Auth error:', error);
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
