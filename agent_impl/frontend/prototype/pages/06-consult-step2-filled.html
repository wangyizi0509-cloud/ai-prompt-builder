<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P06 咨询弹层阶段2 已填写</title>
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/components.css" />
  </head>
  <body>
    <div class="demo-center">
      <section class="phone-shell">
        <div class="phone-screen" style="padding-bottom: 0;">
          <div class="status-row">
            <span>10:08</span>
            <div class="status-icons">
              <span class="signal-icon"></span>
              <span class="wifi-icon"></span>
              <span class="dot-icon"></span>
            </div>
          </div>

          <div class="row justify-between">
            <button class="ghost-btn">☰</button>
            <div class="tip-bubble" style="padding: 8px 12px; border-radius: 20px; font-size: 12px; color: #56566a;">
              小红...<br /><span class="text-muted">咨询对象</span>
            </div>
          </div>

          <div class="sheet-overlay"></div>

          <section class="sheet">
            <header class="sheet-header">
              <h2 class="sheet-title">情感咨询</h2>
              <div class="row gap-16">
                <button class="icon-btn">◌</button>
                <button class="icon-btn" data-close-home>×</button>
              </div>
            </header>

            <div class="chat-ask mt-8">
              <div class="chat-row">
                <img class="avatar-mini" src="../assets/xiaohua.png" alt="avatar" />
                <div class="ask-text">她回复的速度大致如何?</div>
              </div>
              <div class="reply-bubble" id="speed-bubble-filled" style="max-width: 90px;">秒回</div>
            </div>

            <div class="chat-ask mt-8">
              <div class="chat-row">
                <img class="avatar-mini" src="../assets/xiaohua.png" alt="avatar" />
                <div class="ask-text">补充聊天截图，分析更加精准哦！</div>
              </div>
              <div id="thumb-strip-3" class="thumb-row mt-8" style="margin-left: 32px;"></div>
            </div>

            <section class="chat-ask mt-12">
              <div class="chat-row">
                <img class="avatar-mini" src="../assets/xiaohua.png" alt="avatar" />
                <div class="ask-text">补充其他未提到的信息?</div>
              </div>
              <div class="text-area-block mt-8" style="margin-left: 32px;">
                <textarea id="extra-filled" placeholder="请输入其他信息"></textarea>
              </div>
            </section>

            <div class="composer mt-16">
              <img src="../assets/chat_upload_icon.png" alt="icon" width="32" height="32" />
              <input placeholder="请输入您的情感问题..." />
              <button id="save-filled" class="send-btn">➤</button>
            </div>
            <div id="saved-tag" class="loading-tag hidden">已保存 mock 信息</div>
          </section>

          <div class="footer-note" style="bottom: 8px; color: rgba(255,255,255,0.8);">P06 · Figma 2181:2143 · <a href="../index.html">返回目录</a></div>
        </div>
      </section>
    </div>

    <script type="module">
      import { getState, setState } from "../scripts/mock-store.js";
      import { PAGE_IDS } from "../scripts/flow.js";
      import {
        initCommonPage,
        buildThumbList,
        wireCloseToHome,
        wireExtraInput,
      } from "../scripts/bindings.js";

      initCommonPage(PAGE_IDS.P06);
      wireCloseToHome();
      buildThumbList("#thumb-strip-3", { includeMore: true });
      wireExtraInput("#extra-filled");

      const state = getState();
      if (state.speed) {
        document.querySelector("#speed-bubble-filled").textContent = state.speed;
      }
      if (state.extraInfo) {
        document.querySelector("#extra-filled").value = state.extraInfo;
      }

      document.querySelector("#save-filled").addEventListener("click", () => {
        const text = document.querySelector("#extra-filled").value.trim();
        setState({ extraInfo: text });
        const tag = document.querySelector("#saved-tag");
        tag.classList.remove("hidden");
        window.setTimeout(() => tag.classList.add("hidden"), 1000);
      });
    </script>
  </body>
</html>
