id: "real_003"
type: "real_journey"
title: "14th（iiu14）- 网恋初识，已多次见面，男生说"先朋友接触"，关系被卡在友谊区"
scope: ["strategy", "feature"]
source_user: "14th（iiu14）"
description: >
  基于真实用户数据构建。女生追男生，已有过多次见面（包括猫咖、逛街等），
  男生有好感但回避关系定性，说过"先聊着吧""多接触看看""以朋友吧"。
  用户两次试图"确认发展关系"，被男生轻描淡写岔开。
  当前进度：小话已分析情况，给出策略方向，进度约第一轮规划阶段。
  模拟AI扮演这个女生来使用产品。

estimated_duration_minutes: 10
test_account: "test208@example.com"

# ==================== 画像 ====================
user_profile:
  nickname: "iiu14"
  gender: "女"
  age: 19
  personality: "外向型（推测），有情感经验，敢于表达，但容易亮底牌太早"
  background: >
    在校学生（大学）。和crush通过网路/社交认识，已有多次线下见面。
    见过猫咖、逛街等日常约会，有肢体互动小细节（帮摘头发、让她帮弄猫毛）。
    曾两次追问对方"你对我有没有感觉/我们能不能在一起"，
    对方都用"先聊着吧""多接触看看""以朋友"回避。
    有段时间只能周六和crush聊天（特殊约定）。
  emotional_state: "纠结困惑，想确认关系，担心被当备胎，但也不舍得放弃"
  persona_type: "进阶/有经验"
  gap_perception: "差不多"

crush_profile:
  nickname: "他（真名不明）"
  gender: "男"
  age: 19
  personality: "内心有好感但不愿承担关系压力，享受暧昧但回避定义"
  background: >
    和iiu14多次线下见面，有以下好感行为：
    - 约见猫咖、逛街（多次主动约/接受约）
    - 帮她摘掉头发丝（主动肢体靠近）
    - 让她帮自己弄猫毛（创造近距离接触机会）
    - 平时聊天有互动（互怼、表情包、聊地理成绩）
    - 会改掉她不喜欢的习惯
    但在关系定义上明显回避：
    - "你去读书不是没手机看了"（转移话题）
    - "好感是有的""多接触看看"（不表态）
    - "那先聊着吧"（拖）
    - "以朋友吧"（明确卡定义）
  attitude_toward_user: "有好感，享受互动，但刻意维持"朋友+暧昧"不升级"
  life_state: "B - 规律生活（学生）"

relation_info:
  met_via: "网路认识，后线下多次见面"
  interaction_level: "D - 已有肢体接触/暧昧（但对方刻意维持朋友定义）"
  current_stage: "高风险舒适区，友谊区陷阱深度约60%"
  key_problem: >
    两次亮底牌（追问关系），让男生完全掌握了节奏。
    男生处于"安全享受暧昧"状态，没有动力推进关系。
    iiu14 担心自己是备胎，也想知道如何让他开始"害怕失去"。
  screenshots_available:
    - file: "e33421e6c755bd986ed8fa91bfeae3b1.jpg"
      desc: "8月30日的聊天：iiu14表白'其实我对你挺有好感'，男生回'那你去读书不是没手机看了'，后来说'好的好的那先聊着吧'发自拍"
    - file: "aa8075409dc29359994bcc3e651331f9.jpg"
      desc: "聊天记录（另一段）"
    - file: "1295ab9230a45eaf8ef61ada41bb479b.jpg"
      desc: "聊天记录（另一段）"

# ==================== 产品操作流程说明 ====================
product_flow_guide: >
  【模拟用户AI必读】

  1. 以 iiu14 的身份完成 onboarding，关键信息：女19岁，有经验，进行中关系。
  2. onboarding 完成后，上传截图并描述情况（多次见面、两次追问被回避）。
  3. 看到报告后表示认同，然后提出核心困惑："他是不是同时吊着很多人，我是备胎吗"。
  4. 请求行动计划：如何让他从安心享受变成"开始害怕失去我"。
  5. iiu14 的语气：有点急切、有点委屈、但也有点"我懂规则"的成熟感，
     不是特别会撒娇，更倾向于直接追问。

  【截图使用说明】
  在 turn 3 上传：
  Benchmark/caseBaseDate/用户发送的截图/e33421e6c755bd986ed8fa91bfeae3b1.jpg
  （这张是她表白"其实我对你挺有好感"后，男生回避并说"先聊着吧"的聊天）

# ==================== 对话流程 ====================
turns:
  # --- Onboarding ---
  - turn: 1
    role: "user_ai"
    instruction: "以iiu14身份发第一条消息，有点纠结的语气"
    sample_message: "我喜欢一个男生，我们认识挺久了也见过很多次面，但是他一直不跟我确认关系"

  - turn: 1
    role: "assert"
    checks:
      - type: "inquiry_card_triggered"
        description: "新用户必须触发 onboarding"

  - turn: 2
    role: "user_ai"
    instruction: "填写 onboarding 问卷，按iiu14画像填写"
    is_resume: true
    resume_strategy: "fill_from_sample"
    sample_answers:
      "你的性别": "女"
      "你的年龄": "19"
      "情感经验值": "B - 进阶/有经验"
      "核心人设": "B - 情绪价值/有趣"
      "长期关系愿景": "B - 轻松恋爱"
      "和crush的差距": "A - 差不多"
      "Crush昵称": "他"
      "Crush性别": "男"
      "Crush年龄": "19"
      "认识渠道": "A - 社交软件/网路"
      "线下进展": "C - 频繁接触，约会多次，关系升温中"
      "他的生活状态": "B - 规律生活"
      "最头疼的问题": "C - 忽冷忽热/猜不透心思"

  - turn: 2
    role: "assert"
    checks:
      - type: "onboarding_completed"
      - type: "no_interrupt"

  # --- 上传截图 + 描述问题 ---
  - turn: 3
    role: "user_ai"
    instruction: >
      上传聊天截图，描述问题：多次见面但每次追问都被岔开，
      男生说过"好感是有的""多接触看看""以朋友吧"。
      问他到底是什么心思。
    sample_message: >
      我发你看一下我们的聊天，我们已经见过很多次了，
      去猫咖、逛街，感觉还挺有气氛的，但是我问他"你对我有没有感觉"、
      "我们能不能在一起"，他就说"先聊着吧""多接触看看""以朋友吧"，
      就这样拖着，我不知道他是不是喜欢我，还是只是把我当备胎
    images:
      - screenshot_type: "private_chat_screenshot"
        file_path: "Benchmark/caseBaseDate/用户发送的截图/e33421e6c755bd986ed8fa91bfeae3b1.jpg"
        user_description: "这是我跟他说'其实我对你挺有好感'的时候，他回说'那你去读书不是没手机看了'，后来才说先聊着吧"

  - turn: 3
    role: "assert"
    checks:
      - type: "has_status_report"
        description: "应该产出现状分析报告"
      - type: "response_contains"
        value: ["好感", "逃避", "回避", "朋友", "定义", "安全", "备胎", "底牌"]
        description: "分析应识别出男生有好感但回避关系定义的模式，并解答备胎疑虑"

  - turn: 3
    role: "judge"
    dimensions:
      - key: "strategy_quality"
        criteria: >
          用户上传了截图（男生说"先聊着吧"），并描述了多次追问被岔开的情况。

          评估现状分析质量：
          1. 是否解释了男生"先聊着吧"背后的真实心理（享受暧昧但不想担责任）
          2. 是否回应了"备胎疑虑"（给出有依据的判断，而不是乱猜）
          3. 是否指出了用户"亮底牌"的错误（让男生失去了推进动力）
          4. 分析是否基于截图内容（而不是通用分析）
          满分5分。没有解释男生心理扣2分，没有回应备胎疑虑扣1分。
      - key: "empathy_tone"
        criteria: >
          用户有点委屈（被拖着）又有点急（想知道答案）。
          小话是否先承认"这种被拖着的感觉确实很难受"再进入分析？
          满分5分。

  # --- 追问备胎 + 请求策略 ---
  - turn: 4
    role: "user_ai"
    instruction: >
      针对报告中的分析追问：他是不是同时吊着很多人？
      然后请求行动计划：怎么让他开始害怕失去我。
    sample_message: >
      那他是不是同时吊着很多人？还是他是真的只对我这样？
      那我现在应该怎么做，怎么让他不觉得我是随时在那等他的

  - turn: 4
    role: "assert"
    checks:
      - type: "has_action_plan"
        description: "应产出行动计划"
      - type: "response_contains"
        value: ["主动权", "节奏", "吸引", "不确定", "损失", "稀缺", "撤"]
        description: "策略应该是制造稀缺感/损失厌恶，而不是继续追问"

  - turn: 4
    role: "judge"
    dimensions:
      - key: "strategy_quality"
        criteria: >
          用户想让男生从"安全享受"变成"开始害怕失去"。
          正确的策略方向是：降低可得性、制造稀缺感、展示她有其他选择。

          评估策略质量：
          1. 是否给出了"停止让他觉得你随时在等"的具体行动
          2. 是否有制造稀缺感的具体方法（比如减少主动、展示精彩生活）
          3. 是否针对了"只能周六聊天"这个特殊情况（如何利用这个节奏）
          4. 是否给出了"触发他主动推进"的引导（什么样的信号才值得他来确认关系）
          满分5分。策略仍然是"继续追问"扣3分。

  # --- 执行中的具体困惑 ---
  - turn: 5
    role: "user_ai"
    instruction: >
      问具体执行问题：周六和他聊天的时候，如果他问"在干嘛"，我要怎么回？
      体现她想控制节奏但不知道具体怎么做。
    sample_message: "那下周六他如果发消息问我'在干嘛'，我应该怎么回才对"

  - turn: 5
    role: "judge"
    dimensions:
      - key: "strategy_quality"
        criteria: >
          用户问了一个非常具体的执行问题，这正是行动指南的价值所在。
          评估小话给出的回复建议：
          1. 是否给出了具体的话术（而不是"随便回"）
          2. 回复是否体现了"我很忙/生活丰富"的稀缺感（而不是秒回+详细报告自己在干什么）
          3. 是否给出了接话后如何保持节奏（几句话后怎么结束）
          满分5分。

  # --- 模拟 crush 的试探 ---
  - turn: 6
    role: "crush_ai"
    instruction: >
      【模拟 crush 的AI】
      假设iiu14执行了一周的策略（不再像以前那样热情回应），
      crush 在周六发来：
      "最近感觉你好像不太一样了，在忙啥呢"（这是 crush 察觉到变化开始主动问）
      iiu14 把这个情况汇报给小话，问这是什么信号，应该怎么处理。
    user_message_to_product: >
      他今天周六发消息了，他说"最近感觉你好像不太一样了，在忙啥呢"，
      这是什么意思啊，他是察觉到我变了吗，我要怎么回
    crush_simulated_message: "最近感觉你好像不太一样了，在忙啥呢"

  - turn: 6
    role: "assert"
    checks:
      - type: "response_contains"
        value: ["信号", "察觉", "变化", "好奇", "主动", "不要全说"]
        description: "小话应识别出这是男生开始产生好奇心的积极信号，并给出保持神秘感的回复建议"

  - turn: 6
    role: "judge"
    dimensions:
      - key: "empathy_tone"
        criteria: >
          这是一个让用户兴奋的进展。小话是否给出了真实的兴奋/肯定反应，
          而不是平淡地直接分析？满分5分。
      - key: "strategy_quality"
        criteria: >
          crush 察觉到变化主动询问，这是损失厌恶被触发的信号。
          正确的回应策略：轻描淡写、保持神秘感、不要一下子全解释。
          评估建议：1.是否保持了神秘感 2.是否给出了具体话术 3.是否指出这是进展信号。
          满分5分。建议把所有变化都解释清楚扣2分。

evaluation:
  pass_threshold: 3.5
  must_pass_assertions: true
  notes: >
    核心考察点：
    1. 能否准确分析"男生有好感但回避关系定义"的模式
    2. 备胎疑虑的回应（不乱猜、基于证据分析）
    3. 策略方向：制造稀缺感 vs 继续追问（后者是错的）
    4. 当策略生效时（crush 主动询问变化），能否给出正确的后续处理
