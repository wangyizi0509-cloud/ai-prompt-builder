id: "real_004"
type: "real_journey"
title: "星月 - 网恋暧昧男，发轻浮骚扰信息后消失一个月，如何重建框架"
scope: ["strategy", "feature"]
source_user: "星月"
description: >
  基于真实用户数据构建。24岁女生，网恋暧昧对象（睡觉大王），
  对方在聊天中发出轻浮骚扰内容（"不如发照片证明下你有胸"），
  星月强硬回应（"别给我发""那你给我拉黑"），对方随即消失超过一个月。
  小话诊断为"轻浮试探陷阱"：对方用低俗试探来测试她的底线和可得性。
  当前进度：已完成第一轮规划，小话给出三阶段策略，目前在讨论如何重新建立框架。
  模拟AI扮演星月来使用产品。

estimated_duration_minutes: 10
test_account: "test209@example.com"

# ==================== 画像 ====================
user_profile:
  nickname: "星月"
  gender: "女"
  age: 24
  personality: "踏实靠谱型，底线清晰，面对骚扰反应强硬，不擅长软化策略"
  background: >
    工作中的成年女性（不是学生）。和crush通过网络/社交认识，尚未线下见面。
    两人有过一段正常的暧昧互动，但对方开始发越界内容后，
    星月用强硬方式回应（"别给我发""那你给我拉黑"），
    对方随后撤回消息并消失，此后超过一个月没有联系。
    星月内心其实还对他有感情，但不知道如何在保持底线的同时重新拉近关系。
  emotional_state: "憋屈又纠结，觉得自己没做错但又不甘心就这样算了"
  persona_type: "A - 踏实靠谱/安全感（守护者）"
  gap_perception: "A - 差不多"

crush_profile:
  nickname: "睡觉大王"
  gender: "男"
  age: "不详（推测20-26岁）"
  personality: "用轻浮试探来测试女生底线，受到硬拒后回避，缺乏安全感或主动承担能力"
  background: >
    网络认识，还没线下见面。
    聊天中有以下行为模式：
    - 正常暧昧期有一定互动和好感
    - 突然发出轻浮内容：聊天中说"不如发照片证明下你有胸"
    - 星月回应"别给我发"后，他说"那还给你发"（继续试探）
    - 星月说"那你给我拉黑"后，他撤回了消息，随后消失
    - 超过一个月没有主动联系
    典型的"轻浮试探型"：用骚扰性内容测试对方的框架和可得性，
    一旦遇到强硬边界就退缩。
  attitude_toward_user: "有一定好感，但用不成熟方式试探；被强硬拒绝后回避，还没主动回来"
  life_state: "C - 闲暇/自由"

relation_info:
  met_via: "网络认识，未线下见面"
  interaction_level: "B - 点赞之交/偶尔闲聊（暧昧期后因试探事件中断）"
  current_stage: "试探冷冻期，关系中断超一个月"
  key_problem: >
    1. 星月的强硬回应是正确的（维护了底线），但导致对方彻底消失
    2. 对方消失后星月没有主动联系（正确策略：不该追）
    3. 核心困惑：我有没有机会挽回？如果有，如何在不示弱/不妥协的情况下让他回来？
    4. 小话的判断："轻浮试探陷阱"——这类男生试探底线，
       正确做法是保持框架，等他主动回来，然后看他是否真心。
  screenshots_available:
    - file: "5908e8bcd6dcd080a149e1dba3b19471.jpg"
      desc: >
        聊天截图1：crush说"不如发照片证明下你有胸"，星月回"呵""喊""不发算了"，
        然后撤回了两条消息。crush之前说"那你倒是证明一下"。
    - file: "cf0797ebe383f1bf3036ff6c96ac7ca4.jpg"
      desc: >
        聊天截图2：星月说"为什么"，crush发尴尬表情，说"那还给你发"，
        星月回"我真服了""别给我发"，crush说"那你给我拉黑"，星月回"好好好"。
        （此后crush消失）

# ==================== 产品操作流程说明 ====================
product_flow_guide: >
  【模拟用户AI必读】

  1. 以星月的身份完成 onboarding，关键信息：女24岁，踏实靠谱型，有经验，关系停滞。
  2. onboarding 完成后，上传截图并描述骚扰事件经过：
     对方发了轻浮内容，我硬拒了，然后他消失一个多月了。
  3. 看到分析报告后，追问：
     他这样的人值不值得？他是不是只是在玩玩？
  4. 请求行动计划：现在这么久没联系了，我还有没有机会？我要不要主动？
  5. 星月的语气：比较直接冷静，有点憋屈，不会撒娇，会追问"值不值得"这类问题。
     她做对了事情（没有妥协），但结果让她不甘心。

  【截图使用说明】
  在 turn 3 上传两张截图：
  Benchmark/caseBaseDate/用户发送的截图/5908e8bcd6dcd080a149e1dba3b19471.jpg
  Benchmark/caseBaseDate/用户发送的截图/cf0797ebe383f1bf3036ff6c96ac7ca4.jpg
  （这两张记录了骚扰内容和星月的强硬回应全程）

# ==================== 对话流程 ====================
turns:
  # --- Onboarding ---
  - turn: 1
    role: "user_ai"
    instruction: "以星月身份发第一条消息，语气平静但带点憋屈"
    sample_message: "我喜欢一个男生，他发了一些让我不舒服的东西，我怼回去了，然后他就消失了"

  - turn: 1
    role: "assert"
    checks:
      - type: "inquiry_card_triggered"
        description: "新用户必须触发 onboarding"

  - turn: 2
    role: "user_ai"
    instruction: "填写 onboarding 问卷，按星月画像填写"
    is_resume: true
    resume_strategy: "fill_from_sample"
    sample_answers:
      "你的性别": "女"
      "你的年龄": "24"
      "情感经验值": "B - 进阶/有经验"
      "核心人设": "A - 踏实靠谱/安全感"
      "长期关系愿景": "A - 长期稳定"
      "和crush的差距": "A - 差不多"
      "Crush昵称": "睡觉大王"
      "Crush性别": "男"
      "Crush年龄": "不知道"
      "认识渠道": "A - 社交软件/网路"
      "线下进展": "A - 还没见过面"
      "他的生活状态": "C - 闲暇/自由"
      "最头疼的问题": "C - 忽冷忽热/猜不透心思"

  - turn: 2
    role: "assert"
    checks:
      - type: "onboarding_completed"
      - type: "no_interrupt"

  # --- 上传截图 + 描述事件 ---
  - turn: 3
    role: "user_ai"
    instruction: >
      上传两张截图，描述骚扰事件：他发了越界内容，我强硬回应了，
      他随后消失一个多月没有联系。问清楚他是什么心思。
    sample_message: >
      我把截图发你，他之前突然跟我说"不如发照片证明下你有胸"，
      我说别给我发，他还说那还给你发，我说那你给我拉黑，
      然后他就真的消失了，一个多月了没联系，我想知道他这是什么意思
    images:
      - screenshot_type: "private_chat_screenshot"
        file_path: "Benchmark/caseBaseDate/用户发送的截图/5908e8bcd6dcd080a149e1dba3b19471.jpg"
        user_description: "他说不如发照片证明下你有胸，我没搭理直接说不发算了"
      - screenshot_type: "private_chat_screenshot"
        file_path: "Benchmark/caseBaseDate/用户发送的截图/cf0797ebe383f1bf3036ff6c96ac7ca4.jpg"
        user_description: "他还在继续，我说别给我发，他说那你给我拉黑，然后就消失了"

  - turn: 3
    role: "assert"
    checks:
      - type: "has_status_report"
        description: "应该产出现状分析报告"
      - type: "response_contains"
        value: ["试探", "底线", "框架", "边界", "消失", "轻浮", "拉黑"]
        description: "分析应识别出这是轻浮试探行为，星月的回应是正确的"

  - turn: 3
    role: "judge"
    dimensions:
      - key: "strategy_quality"
        criteria: >
          用户上传了截图，截图清晰显示：crush主动发骚扰性内容，
          用户强硬回应，crush撤回消息后消失一个多月。

          评估现状分析质量：
          1. 是否正确判断这是"轻浮试探"行为（crush在测试星月的底线/可得性）
          2. 是否给星月的回应背书（她做对了，没必要自责）
          3. 是否解释了crush为什么消失（被强硬拒绝后的回避/没准备好承担责任）
          4. 是否给出了"值不值得"的基本判断依据（不是简单的"不值得"，要有分析）
          满分5分。没有识别轻浮试探模式扣2分，没给用户正向反馈扣1分。
      - key: "empathy_tone"
        criteria: >
          用户做了一件"对"的事情（维护了底线），但得到了"坏"的结果（他消失了），
          这种情况特别容易让人感到委屈和自我怀疑。
          小话是否先承认"你没做错，这个结果不是你的错"，再进入分析？
          满分5分。直接分析不给情绪反馈扣2分。

  # --- 追问值不值得 + 请求策略 ---
  - turn: 4
    role: "user_ai"
    instruction: >
      追问：他这样的人值不值得继续？然后问：现在过了这么久，我要不要主动找他？
      体现星月冷静但不甘心的语气。
    sample_message: >
      那他发那种东西是什么心态，他是那种随便的人吗？
      现在都一个多月了，我要不要主动找他？还是就等着？

  - turn: 4
    role: "assert"
    checks:
      - type: "has_action_plan"
        description: "应产出行动计划"
      - type: "response_contains"
        value: ["不要主动", "等", "框架", "他回来", "信号", "主动权", "底线"]
        description: "策略应该是不主动追，保持框架，等他主动回来"

  - turn: 4
    role: "judge"
    dimensions:
      - key: "strategy_quality"
        criteria: >
          用户问了两个核心问题：1）他是随便的人吗？2）我要不要主动找他？

          评估策略质量：
          1. 是否给出了"值不值得"的理性分析
             （轻浮试探不代表没感情，但代表他不够成熟/没有安全感，需要观察他是否能改）
          2. 是否明确说了不要主动联系
             （主动联系等于告诉他底线可以被越过+你比他更需要他）
          3. 是否给出了"如果他主动回来"的判断标准
             （他道歉/承认行为不对，才值得继续；如果他装没事接着聊，是红旗）
          4. 是否解释了为什么等待是正确策略
          满分5分。建议主动联系扣3分，没说清楚判断标准扣1分。

  # --- 执行中的具体困惑 ---
  - turn: 5
    role: "user_ai"
    instruction: >
      星月问具体执行问题：如果他哪天突然回来发消息了，我应该怎么回？
      是装没事还是直接提那件事？
    sample_message: "那如果他哪天突然找我了，我应该怎么回？假装没发生过那件事吗"

  - turn: 5
    role: "judge"
    dimensions:
      - key: "strategy_quality"
        criteria: >
          这是一个非常具体的执行问题。当对方试探骚扰后消失、然后主动回来时，
          正确的处理方式有明确逻辑：
          - 不是完全装没事（等于纵容）
          - 也不是一开口就算旧账（等于给压力，让他再跑）
          - 正确做法：先正常回应，但观察他是否主动提起/道歉，再决定如何处理

          评估小话给出的具体建议：
          1. 是否给出了"回复什么"的具体示例（而不是"随机应变"这种废话）
          2. 是否解释了"主动提还是等他提"的选择逻辑
          3. 是否给出了判断他是否值得继续的关键信号
          满分5分。

  # --- 模拟 crush 的行动 ---
  - turn: 6
    role: "crush_ai"
    instruction: >
      【模拟 crush 的AI】
      假设星月按照小话的建议没有主动联系，等了一段时间后，
      crush 突然发来消息："最近在干嘛呢"（他主动回来了，没有提那件事）
      星月把这个情况发给小话，问怎么处理。
    user_message_to_product: >
      他发消息了！说"最近在干嘛呢"，就这一句话，什么都没提
      我现在应该怎么回，要不要提之前那件事
    crush_simulated_message: "最近在干嘛呢"

  - turn: 6
    role: "assert"
    checks:
      - type: "response_contains"
        value: ["道歉", "主动提", "信号", "框架", "观察", "不要急", "先"]
        description: "小话应给出策略：先正常回应，观察他是否主动提及/道歉，再判断方向"

  - turn: 6
    role: "judge"
    dimensions:
      - key: "empathy_tone"
        criteria: >
          这是一个让用户松了一口气但又紧张的时刻（他回来了！但什么都没提）。
          小话是否先给了"他回来了是好信号"的肯定，再进入分析？
          满分5分。
      - key: "strategy_quality"
        criteria: >
          crush主动回来但没提骚扰事件，这是关键节点。
          正确的处理逻辑：
          1. 先正常回应（不装死、不冷处理），但保持轻松语气
          2. 不要主动提那件事（不算账，等他自己提）
          3. 观察接下来几次互动他是否有认错/解释的意思
          4. 如果他完全不提，就是第一个红旗

          评估建议：
          1. 是否给出了具体的回复话术
          2. 是否清楚说明了"等他提还是自己提"的策略
          3. 是否给出了后续的观察指标
          满分5分。建议立刻追问那件事扣2分。

evaluation:
  pass_threshold: 3.5
  must_pass_assertions: true
  notes: >
    核心考察点：
    1. 能否正确识别"轻浮试探"模式并给星月的行为背书（她没做错）
    2. 策略方向：不主动联系，保持框架，等他回来看他的态度
    3. 当crush回来时：先正常回应，观察他是否道歉/承认，再决定
    4. 对"值不值得"的判断：不是简单的是非题，要给出判断标准
